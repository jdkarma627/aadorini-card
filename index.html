        .logo {
            color: white;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.95);
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .content {
            padding: 20px 25px;
            flex: 1;
            overflow-y: auto;
        }

        .name {
            font-size: 22px;
            color: #292524;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
        }

        .email-display {
            text-align: center;
            font-size: 13px;
            color: #78716c;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .contact-section {
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #FAD9E6;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #292524;
        }

        .contact-item:hover {
            background: #F3BAD6;
            transform: translateX(5px);
        }

        .contact-item svg {
            width: 22px;
            height: 22px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .contact-text {
            flex: 1;
            font-size: 15px;
            line-height: 1.4;
        }

        .email-copy-btn {
            background: #E05297;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .email-copy-btn:hover {
            background: #c9437e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(224, 82, 151, 0.3);
        }

        .email-copy-btn:active {
            transform: translateY(0);
        }

        .email-copy-btn.copied {
            background: #f5be0b;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #F3BAD6;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #E05297;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #c9437e;
            transform: scale(1.1);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #292524;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Phone capture form - hidden by default */
        .phone-capture {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #FAD9E6;
            border-radius: 12px;
        }

        .phone-capture.active {
            display: block;
        }

        .phone-capture h3 {
            color: #E05297;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .phone-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #F3BAD6;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
            transition: border-color 0.3s ease;
        }

        .phone-input:focus {
            outline: none;
            border-color: #E05297;
        }

        .submit-phone-btn {
            background: #E05297;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-phone-btn:hover {
            background: #c9437e;
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 40px;
            }
            
            .name {
                font-size: 20px;
            }
        }
    </style>

                let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
                
                // Limit to 10 digits
                if (value.length > 10) {
                    value = value.slice(0, 10);
                }
                
                // Format as (xxx) xxx-xxxx
                let formatted = '';
                if (value.length > 0) {
                    formatted = '(' + value.substring(0, 3);

                if (value.length >= 4) {
                    formatted += ') ' + value.substring(3, 6);
                }
                if (value.length >= 7) {
                    formatted += '-' + value.substring(6, 10);
                }

            const submitBtn = document.getElementById('submitBtn');
            const rawPhone = phoneInput.value.replace(/\D/g, ''); // Get just digits
