<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadorini - Ethnic Wear</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 64, 129, 0.2);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            position: relative;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #FF4081 0%, #F50057 100%);
            padding: 25px 30px 20px;
            text-align: center;
            position: relative;
        }

        .saree-silhouette {
            position: absolute;
            top: -30px;
            right: -40px;
            width: 200px;
            height: 220px;
            opacity: 0.12;
            background-image: url('saree-silhouette.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .saree-silhouette-left {
            position: absolute;
            bottom: -40px;
            left: -50px;
            width: 180px;
            height: 200px;
            opacity: 0.12;
            background-image: url('saree-silhouette.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: scaleX(-1);
        }

        .logo {
            color: white;
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.95);
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .content {
            padding: 20px 25px;
            flex: 1;
            overflow-y: auto;
        }

        .name {
            font-size: 22px;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
        }

        .email-display {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .contact-section {
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #FFF0F5;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }

        .contact-item:hover {
            background: #FFE4E9;
            transform: translateX(5px);
        }

        .contact-item svg {
            width: 22px;
            height: 22px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .contact-text {
            flex: 1;
            font-size: 15px;
            line-height: 1.4;
        }

        .email-copy-btn {
            background: #FF4081;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .email-copy-btn:hover {
            background: #F50057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.3);
        }

        .email-copy-btn:active {
            transform: translateY(0);
        }

        .email-copy-btn.copied {
            background: #4CAF50;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #FFE4E9;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #FF4081;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #F50057;
            transform: scale(1.1);
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Phone capture form - hidden by default */
        .phone-capture {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #FFF0F5;
            border-radius: 12px;
        }

        .phone-capture.active {
            display: block;
        }

        .phone-capture h3 {
            color: #FF4081;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .phone-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #FFE4E9;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 8px;
            transition: border-color 0.3s ease;
        }

        .phone-input:focus {
            outline: none;
            border-color: #FF4081;
        }

        .submit-phone-btn {
            background: #FF4081;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-phone-btn:hover {
            background: #F50057;
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 40px;
            }
            
            .name {
                font-size: 20px;
            }
        }
    </style>
</head>
