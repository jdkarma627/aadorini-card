            margin-bottom: 6px;

            font-style: italic;

            font-size: 14px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 300;
        }

        .content {
            padding: 20px 25px;
            flex: 1;
            overflow-y: auto;
        }

        .name {
            font-size: 26px;
            color: #292524;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 500;
        }

        .email-display {
            text-align: center;
            font-size: 15px;
            color: #78716c;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .contact-section {
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            background: #FAD9E6;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #292524;
        }

        .contact-item:hover {
            background: #F3BAD6;
            transform: translateX(5px);
        }

        .contact-item svg {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .contact-text {
            flex: 1;
            font-size: 17px;
            line-height: 1.4;
        }

        .email-copy-btn {
            background: #E05297;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .email-copy-btn:hover {
            background: #c9437e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(224, 82, 151, 0.3);
        }

        .email-copy-btn:active {
            transform: translateY(0);
        }

        .email-copy-btn.copied {
            background: #f5be0b;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #F3BAD6;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #E05297;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: #c9437e;
            transform: scale(1.1);
        }

        .social-link svg {
            width: 26px;
            height: 26px;
            fill: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #292524;
            color: white;
            padding: 16px 28px;
            border-radius: 8px;
            font-size: 15px;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 42px;
            }
            
            .name {
                font-size: 24px;
            }
            
            .tagline {
                font-size: 13px;
            }
            
            .contact-text {
                font-size: 16px;
            }
        }

        function copyEmail() {
            const email = 'yashkarma03@gmail.com';
            const btn = document.querySelector('.email-copy-btn');
            const btnText = document.getElementById('emailBtnText');
            
            navigator.clipboard.writeText(email).then(() => {
                btn.classList.add('copied');
                btnText.textContent = 'Email Copied!';
                showToast('Email copied! Ready for E-Transfer');
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btnText.textContent = 'Copy Email for E-Transfer';

            }).catch(() => {

        function downloadContact() {
            const vcard = `BEGIN:VCARD

END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Aadorini-Contact.vcf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
            
            showToast('Contact card downloaded!');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
